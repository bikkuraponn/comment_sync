name: Sync Comments

on:
  repository_dispatch:
    types: [sync-comments]

concurrency:
  group: sync-comments
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secret
        env:
          CRONJOB_SECRET: ${{ secrets.CRONJOB_SECRET }}
        run: |
          if [[ "${{ github.event.client_payload.secret }}" != "$CRONJOB_SECRET" ]]; then
            echo "Invalid secret"
            exit 1
          fi

      - name: Run sync
        env:
          API_KEY_FOR_ALL_COMMENT_GET:  ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET }}
          API_KEY_FOR_ALL_COMMENT_GET2: ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET2 }}
          API_KEY_FOR_ALL_COMMENT_GET3: ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET3 }}
          # ksk(加速)追跡専用。本体同期とは別プロジェクトのキーにすること —
          # 加速中はコメント急増中でもあり、コアと同じキープールを食うと
          # 新着同期そのものを止めかねない
          API_KEY_FOR_KSK:  ${{ secrets.API_KEY_FOR_KSK }}
          VIDEO_ID:         ${{ vars.VIDEO_ID }}
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FLASK_BASE_URL:   ${{ vars.FLASK_BASE_URL }}
          API_TOKEN:        ${{ secrets.API_TOKEN }}
        run: python sync.py
