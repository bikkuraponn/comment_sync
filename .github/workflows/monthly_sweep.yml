name: Monthly Sweep

on:
  # 15:10 UTC is 00:10 JST on the following calendar day.  Run only on
  # possible month-end UTC dates, then gate the actual sweep on JST day 1
  # below.  This avoids relying on an external cron-job.org dispatch.
  schedule:
    - cron: "10 15 28-31 * *"
  repository_dispatch:
    types: [sync-comments-monthly]
  workflow_dispatch:
    inputs:
      days:
        description: "遡る日数"
        required: false
        default: "31"
      dry_run:
        description: "対象件数と概算コストだけ出す"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-comments-monthly
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secret
        if: github.event_name == 'repository_dispatch'
        env:
          CRONJOB_SECRET: ${{ secrets.CRONJOB_SECRET }}
        run: |
          if [[ "${{ github.event.client_payload.secret }}" != "$CRONJOB_SECRET" ]]; then
            echo "Invalid secret"
            exit 1
          fi

      - name: Run monthly sweep
        env:
          API_KEY_FOR_ALL_COMMENT_GET:  ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET }}
          API_KEY_FOR_ALL_COMMENT_GET2: ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET2 }}
          API_KEY_FOR_ALL_COMMENT_GET3: ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET3 }}
          VIDEO_ID:         ${{ vars.VIDEO_ID }}
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SWEEP_DAYS:       ${{ github.event.inputs.days || '31' }}
          SWEEP_DRY_RUN:    ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=Asia/Tokyo date +%d)" != "01" ]]; then
            echo "Not the first day of the month in JST; skipping monthly sweep."
            exit 0
          fi
          ARGS="--days $SWEEP_DAYS"
          if [[ "$SWEEP_DRY_RUN" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          python monthly_sweep.py $ARGS
